# Reverse proxy — TLS côté Cloudflare uniquement, origin HTTP.
# cloudflared → http://127.0.0.1:443 → nginx → game:3000

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream game {
        server game:3000;
        keepalive 32;
    }

    # Entrée cloudflared (:443)
    server {
        listen 443;
        server_name survival.badom.ch localhost 127.0.0.1;

        location / {
            proxy_pass http://game;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # Port public type hébergeur (4000–4009) — debug / futurs shards
    server {
        listen 4000;
        server_name survival.badom.ch localhost 127.0.0.1;

        location / {
            proxy_pass http://game;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header X-Forwarded-Port 4000;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
