# Stack mono-VM (dev rapide) — équivalent db + app sur une machine
# Architecture pro 2 VM : docker-compose.db.yml + docker-compose.app.yml
# Doc : docs/ARCHITECTURE_TIERS.md

name: zs-vm

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USER:-zs_app}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_DATABASE: zombie_game_db
    volumes:
      - ${ZS_DATA_DIR:-./data}/mariadb:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - zs-internal
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -u root -p"$$MARIADB_ROOT_PASSWORD" --silent || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 2g
    cpus: 0.5

  auth:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: zs-node:prod-sim
    restart: unless-stopped
    stop_grace_period: 15s
    env_file: .env
    environment:
      NODE_ENV: production
      AUTH_HOST: 0.0.0.0
      AUTH_PORT: 3001
      HEALTH_PORT: 3001
      TRUST_PROXY: 'true'
      DB_CLIENT: mysql
      AUTH_DB_CLIENT: mysql
      DB_HOST: mariadb
      AUTH_DB_HOST: mariadb
      DB_PORT: 3306
      AUTH_DB_PORT: 3306
      DB_USER: ${DB_USER:-zs_app}
      AUTH_DB_USER: ${DB_USER:-zs_app}
      DB_PASS: ${DB_PASS}
      AUTH_DB_PASS: ${DB_PASS}
      DB_NAME: zombie_game_db
      AUTH_DB_NAME: zombie_auth_db
    entrypoint: ['sh', 'infra/docker/scripts/auth-entrypoint.sh']
    expose:
      - '3001'
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - zs-internal
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:3001/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    mem_limit: 512m
    cpus: 0.5

  game:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: zs-node:prod-sim
    restart: unless-stopped
    stop_grace_period: 60s
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      HEALTH_PORT: 3000
      TRUST_PROXY: 'true'
      AUTH_MODE: standalone
      AUTH_INTERNAL_URL: http://auth:3001
      DB_CLIENT: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_USER: ${DB_USER:-zs_app}
      DB_PASS: ${DB_PASS}
      DB_NAME: zombie_game_db
      LOG_DIR: /app/logs/server
    entrypoint: ['sh', 'infra/docker/scripts/game-entrypoint.sh']
    volumes:
      - ${ZS_DATA_DIR:-./data}/logs:/app/logs/server
    expose:
      - '3000'
    depends_on:
      mariadb:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - zs-internal
      - zs-edge
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://127.0.0.1:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    mem_limit: 8g
    cpus: 3

networks:
  zs-internal:
    internal: true
  zs-edge:
    external: true
    name: zs-edge
