# VM BDD — tier données uniquement (MariaDB)
# Déployer sur la VM « db » — voir docs/ARCHITECTURE_TIERS.md
#
#   cp .env.db.example .env
#   docker compose -f docker-compose.db.yml --env-file .env up -d
#
# Prod : UFW n'autorise le port 3306 que depuis l'IP privée de la VM app.

name: zs-db

services:
  mariadb:
    image: mariadb:11.4
    restart: unless-stopped
    stop_grace_period: 30s
    env_file: .env
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: ${DB_USER:-zs_app}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_DATABASE: zombie_game_db
    volumes:
      - ${ZS_DATA_DIR:-./data}/mariadb:/var/lib/mysql
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - zs-db-net
    ports:
      # VM prod : remplacer par l'IP privée — ex. 10.0.0.10:3306:3306
      - ${DB_BIND:-127.0.0.1:3306}:3306
    healthcheck:
      test: ['CMD-SHELL', 'mariadb-admin ping -h 127.0.0.1 -u root -p"$$MARIADB_ROOT_PASSWORD" --silent || exit 1']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 4g
    cpus: 1

networks:
  zs-db-net:
    name: zs-db-net
    driver: bridge
