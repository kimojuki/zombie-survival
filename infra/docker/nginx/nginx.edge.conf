# Edge nginx — conteneur séparé, reste up pendant rebuild game/auth/db.
# cloudflared → :443 → edge → (static site | proxy game:3000 | maintenance)
#
# Static : landing marketing (index, css, img, landing.js)
# Proxy  : api, socket.io, play, game, js client jeu

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # DNS Docker — upstream résolu à la requête (game peut être absent)
    resolver 127.0.0.11 valid=5s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $upstream_status $maintenance_mode {
        default 0;
        502     1;
        503     1;
        504     1;
        ''      1;
    }

    server {
        listen 443;
        server_name survival.badom.ch localhost 127.0.0.1;
        set $zs_forward_proto "https";
        set $zs_forward_port "443";

        root /var/www/zs;
        index index.html;

        # ── Site marketing (toujours servi par edge, même si game down) ──
        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location /css/ {
            add_header Cache-Control "public, max-age=3600";
        }
        location /img/ {
            add_header Cache-Control "public, max-age=86400";
        }
        location = /js/landing.js {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location = /manifest.webmanifest {
            add_header Cache-Control "public, max-age=3600";
        }
        location = /robots.txt {
            add_header Cache-Control "public, max-age=3600";
        }

        # ── Backend game (maintenance si indisponible) ──
        location /api/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_api;
        }
        location /socket.io/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_api;
        }
        location = /play.html {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location = /game.html {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location /js/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location /src/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location /client-version.json {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 =503;
        }

        location @maintenance_html {
            internal;
            root /var/www/zs;
            try_files /maintenance.html =503;
            add_header Cache-Control "no-store";
            add_header X-ZS-Maintenance "1" always;
        }

        location @maintenance_api {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store";
            add_header X-ZS-Maintenance "1" always;
            return 503 '{"ok":false,"maintenance":true,"message":"Serveur en redémarrage — réessayez dans un instant."}';
        }
    }

    server {
        listen 4000;
        server_name survival.badom.ch localhost 127.0.0.1;
        set $zs_forward_proto "http";
        set $zs_forward_port "4000";

        root /var/www/zs;
        index index.html;

        location = / {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }
        location /css/ { add_header Cache-Control "public, max-age=3600"; }
        location /img/ { add_header Cache-Control "public, max-age=86400"; }
        location = /js/landing.js { add_header Cache-Control "no-cache, must-revalidate"; }
        location = /manifest.webmanifest { add_header Cache-Control "public, max-age=3600"; }
        location = /robots.txt { add_header Cache-Control "public, max-age=3600"; }

        location /api/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_api;
        }
        location /socket.io/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_api;
        }
        location = /play.html {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location = /game.html {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location /js/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location /src/ {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 = @maintenance_html;
        }
        location /client-version.json {
            include /etc/nginx/proxy_game.conf;
            error_page 502 503 504 =503;
        }

        location @maintenance_html {
            internal;
            root /var/www/zs;
            try_files /maintenance.html =503;
            add_header Cache-Control "no-store";
            add_header X-ZS-Maintenance "1" always;
        }

        location @maintenance_api {
            internal;
            default_type application/json;
            add_header Cache-Control "no-store";
            add_header X-ZS-Maintenance "1" always;
            return 503 '{"ok":false,"maintenance":true,"message":"Serveur en redémarrage — réessayez dans un instant."}';
        }
    }
}
